version: 2
updates:
  # -------------------------------------------------------------
  # 1. GitHub Actions (Group all actions into a single monthly PR)
  # -------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"

  # -------------------------------------------------------------
  # 2. Gradle Dependencies & Plugins
  # -------------------------------------------------------------
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle-deps:
        patterns:
          - "*"
        # Exclude paper-api from automatic grouping if handled manually:
        exclude-patterns:
          - "io.papermc.paper:paper-api"

    # Optional: Prevent Paper from jumping to a newer major Minecraft release
    # (keeps your plugin targeted at 1.21.x until you're ready to update)
    ignore:
      - dependency-name: "io.papermc.paper:paper-api"
        # update-types: ["version-update:semver-major"] # or ignore completely