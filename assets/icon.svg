<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Voice Group Manager</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a5c"/>
      <stop offset="1" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- sound waves -->
  <g fill="none" stroke="url(#wave)" stroke-width="5" stroke-linecap="round">
    <path d="M52.7 48.7 A16 16 0 0 1 75.3 48.7"/>
    <path d="M44.2 40.2 A28 28 0 0 1 83.8 40.2" opacity=".85"/>
    <path d="M35.7 31.7 A40 40 0 0 1 92.3 31.7" opacity=".6"/>
  </g>

  <!-- back left player -->
  <path d="M14 112 V102 a10 10 0 0 1 10-10 H52 V112 Z" fill="#d98a2b"/>
  <rect x="24" y="64" width="22" height="22" rx="3" fill="#f5b84d"/>
  <rect x="28" y="73" width="4" height="4" fill="#141c33"/>
  <rect x="38" y="73" width="4" height="4" fill="#141c33"/>

  <!-- back right player -->
  <path d="M114 112 V102 a10 10 0 0 0-10-10 H76 V112 Z" fill="#d6537a"/>
  <rect x="82" y="64" width="22" height="22" rx="3" fill="#f58fae"/>
  <rect x="86" y="73" width="4" height="4" fill="#141c33"/>
  <rect x="96" y="73" width="4" height="4" fill="#141c33"/>

  <!-- front player -->
  <path d="M38 112 V104 a14 14 0 0 1 14-14 H76 a14 14 0 0 1 14 14 V112 Z" fill="#1fae8e"/>
  <rect x="50" y="56" width="28" height="28" rx="3.5" fill="#4fe3b5"/>
  <rect x="56" y="67" width="5" height="5" fill="#141c33"/>
  <rect x="67" y="67" width="5" height="5" fill="#141c33"/>
</svg>
