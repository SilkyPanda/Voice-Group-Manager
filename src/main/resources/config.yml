# Config version. Do not change this: it lets the plugin add new settings after an update.
config_version: 2

# Default /instantgroup radius, in blocks (a sphere around the player). Must be at least 1.
default_instant_group_range: 128

# Largest radius anyone can ask for with /instantgroup <range>. Must be at least 1.
max_instant_group_range: 256

# Name used when /instantgroup has to create a new group.
instant_group_name: 'Instant Group'

# Show a voice-group summary to players when they join. Hidden groups are omitted.
group_summary: true

# Tell players when they are added to a group by /instantgroup, /forcejoingroup or auto-join.
notify_moved_players: true

# How messages.yml is read.
#   LEGACY      '&' colour codes, for example &a (the default).
#   MINIMESSAGE MiniMessage tags such as <green> or <gradient:red:blue>. '&' codes still work too.
# Run /voicegroupmanager reload after changing this.
message_format: LEGACY

# Force the group type used for groups created through the Simple Voice Chat GUI.
# Options: OFF (do not force), NORMAL, OPEN, ISOLATED.
# This does not override the type explicitly selected by /persistentgroup add.
force_group_type: OFF

# Default access for each command permission node below.
# Options: EVERYONE (all players), OPS (server operators), NOONE (disabled by default).
# Permission plugins can still grant individual nodes. voicegroupmanager.admin grants every node.
# Run /voicegroupmanager reload after editing this file.
permission_defaults:
  # Permission: voicegroupmanager.instantgroup
  instantgroup: OPS
  # Permission: voicegroupmanager.persistentgroup
  persistentgroup: OPS
  # Permission: voicegroupmanager.autojoingroup
  autojoingroup: EVERYONE
  # Permission: voicegroupmanager.autojoingroup.global
  autojoingroup_global: OPS
  # Permission: voicegroupmanager.forcejoingroup
  forcejoingroup: OPS
