name: VoiceGroupManager
version: '${version}'
main: dev.voicegroupmanager.VoiceGroupManagerPlugin
api-version: '1.21.1'
depend: [voicechat]
description: Server-side voice group management for Simple Voice Chat
commands:
  voicegroupmanager:
    description: Manage the Voice Group Manager plugin
    usage: /voicegroupmanager reload
    aliases: [vgm]
    permission: voicegroupmanager.reload
  instantgroup:
    description: Create or join an instant voice group with nearby players
    usage: /instantgroup [range]
    permission: voicegroupmanager.instantgroup
  persistentgroup:
    description: Manage persistent voice groups
    usage: /persistentgroup <list|add|remove> [arguments]
    permission: voicegroupmanager.persistentgroup
  autojoingroup:
    description: Configure personal or global automatic group joining
    usage: /autojoingroup <set|remove|global> [arguments]
  forcejoingroup:
    description: Move a player into your current voice group
    usage: /forcejoingroup <player>
    permission: voicegroupmanager.forcejoingroup
permissions:
  voicegroupmanager.admin:
    description: Grants every Voice Group Manager permission, regardless of the defaults in config.yml
    default: op
    children:
      voicegroupmanager.instantgroup: true
      voicegroupmanager.persistentgroup: true
      voicegroupmanager.autojoingroup: true
      voicegroupmanager.autojoingroup.global: true
      voicegroupmanager.forcejoingroup: true
      voicegroupmanager.reload: true
  voicegroupmanager.instantgroup:
    description: Use /instantgroup
    default: true
  voicegroupmanager.persistentgroup:
    description: Use /persistentgroup
    default: op
  voicegroupmanager.autojoingroup:
    description: Use /autojoingroup for yourself
    default: true
  voicegroupmanager.autojoingroup.global:
    description: Use /autojoingroup global
    default: op
  voicegroupmanager.forcejoingroup:
    description: Use /forcejoingroup
    default: op
  voicegroupmanager.reload:
    description: Use /voicegroupmanager reload
    default: op
