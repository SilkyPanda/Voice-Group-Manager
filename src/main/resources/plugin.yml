name: VoiceGroupManager
version: '${version}'
main: dev.voicegroupmanager.VoiceGroupManagerPlugin
api-version: '1.21.1'
depend: [voicechat]
description: Server-side voice group management for Simple Voice Chat
permissions:
  voicegroupmanager.admin:
    description: Grants every Voice Group Manager permission, regardless of the defaults in config.yml
    default: op
    children:
      voicegroupmanager.instantgroup: true
      voicegroupmanager.persistentgroup: true
      voicegroupmanager.autojoingroup: true
      voicegroupmanager.autojoingroup.global: true
      voicegroupmanager.forcejoingroup: true
      voicegroupmanager.reload: true
      voicegroupmanager.info: true
  voicegroupmanager.instantgroup:
    description: Use /instantgroup
    default: op
  voicegroupmanager.persistentgroup:
    description: Use /persistentgroup (list, add, edit, remove)
    default: op
  voicegroupmanager.autojoingroup:
    description: Use /autojoingroup for yourself
    default: true
  voicegroupmanager.autojoingroup.global:
    description: Use /autojoingroup global
    default: op
  voicegroupmanager.forcejoingroup:
    description: Use /forcejoingroup to move a player into a voice group
    default: op
  voicegroupmanager.reload:
    description: Use /voicegroupmanager reload
    default: op
  voicegroupmanager.info:
    description: Use /voicegroupmanager info and /voicegroupmanager groups
    default: op
